<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic page information -->
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Universe Smash - A cosmic physics sandbox game"
    >

    <meta
        name="author"
        content="Universe Smash"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>Universe Smash</title>


    <!-- Game stylesheet -->
    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <!-- =========================================
         STARTUP SCREEN
    ========================================== -->

    <div
        id="startup-screen"
        aria-label="Universe Smash startup screen"
    >

        <div class="startup-container">

            <div class="startup-title">
                UNIVERSE SMASH
            </div>

            <div class="startup-subtitle">
                COSMIC SIMULATION ENGINE
            </div>

            <div class="loading-container">

                <div class="loading-bar">

                    <div
                        id="loading-progress"
                        class="loading-progress"
                    ></div>

                </div>

            </div>

            <div
                id="press-start"
                class="press-start"
                style="display: none;"
            >
                PRESS START
            </div>

        </div>

    </div>


    <!-- =========================================
         MAIN MENU
    ========================================== -->

    <div
        id="main-menu"
        aria-label="Main menu"
    >

        <div class="menu-container">

            <div class="menu-title">
                UNIVERSE SMASH
            </div>

            <div class="menu-buttons">

                <button
                    id="planet-mode-button"
                    class="menu-button"
                    type="button"
                >
                    PLANET MODE
                </button>

                <button
                    id="solar-mode-button"
                    class="menu-button"
                    type="button"
                >
                    SOLAR SYSTEM MODE
                </button>

                <button
                    id="settings-button"
                    class="menu-button"
                    type="button"
                >
                    SETTINGS
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================
         GAME CANVAS
    ========================================== -->

    <canvas
        id="game-canvas"
        aria-label="Universe Smash game canvas"
    >
        Your browser does not support HTML5 Canvas.
    </canvas>


    <!-- =========================================
         SOLAR SYSTEM MODE MENU
    ========================================== -->

    <div
        id="sandbox-menu"
        aria-label="Solar System controls"
    >

        <div class="menu-section-title">
            SOLAR SYSTEM
        </div>

        <button
            class="game-button"
            data-type="star"
            type="button"
        >
            ⭐ STAR
        </button>

        <button
            class="game-button"
            data-type="blue-hypergiant"
            type="button"
        >
            🔵 BLUE HYPERGIANT
        </button>

        <button
            class="game-button"
            data-type="contact-binary"
            type="button"
        >
            ⭐ CONTACT BINARY
        </button>

        <button
            class="game-button"
            data-type="planet"
            type="button"
        >
            🌎 PLANET
        </button>

        <button
            class="game-button"
            data-type="moon"
            type="button"
        >
            🌙 MOON
        </button>

        <button
            class="game-button"
            data-type="asteroid"
            type="button"
        >
            ☄️ ASTEROID
        </button>

        <button
            class="game-button"
            data-type="antimatter"
            type="button"
        >
            💜 ANTIMATTER WORLD
        </button>

        <button
            class="game-button"
            data-type="black-hole"
            type="button"
        >
            🕳️ BLACK HOLE
        </button>

        <button
            class="game-button"
            data-type="grey-hole"
            type="button"
        >
            🔴 GREY HOLE
        </button>

        <button
            class="game-button"
            data-type="wormhole"
            type="button"
        >
            🌀 WORMHOLE
        </button>

        <button
            id="solar-reset"
            class="game-button"
            type="button"
        >
            🎯 RESET CAMERA
        </button>

        <button
            id="solar-clear"
            class="game-button"
            type="button"
        >
            🗑️ CLEAR SYSTEM
        </button>

        <button
            id="solar-menu"
            class="game-button"
            type="button"
        >
            ← MAIN MENU
        </button>

    </div>


    <!-- =========================================
         PLANET MODE WEAPON MENU
    ========================================== -->

    <div
        id="planet-weapon-menu"
        aria-label="Planet Mode weapons"
    >

        <div class="menu-section-title">
            PLANET MODE
        </div>

        <button
            class="game-button"
            data-weapon="laser"
            type="button"
        >
            🔴 LASER
        </button>

        <button
            class="game-button"
            data-weapon="ice"
            type="button"
        >
            ❄️ ICE LASER
        </button>

        <button
            class="game-button"
            data-weapon="asteroid"
            type="button"
        >
            ☄️ ASTEROID
        </button>

        <button
            class="game-button"
            data-weapon="mystery"
            type="button"
        >
            ❓ MYSTERY MATTER
        </button>

        <button
            class="game-button"
            data-weapon="alien"
            type="button"
        >
            👽 ALIEN SHIP
        </button>

        <button
            class="game-button"
            data-weapon="antimatter"
            type="button"
        >
            💜 ANTIMATTER
        </button>

        <button
            id="planet-reset"
            class="game-button"
            type="button"
        >
            🔄 RESET PLANET
        </button>

        <button
            id="planet-menu"
            class="game-button"
            type="button"
        >
            ← MAIN MENU
        </button>

    </div>


    <!-- =========================================
         GAME INFORMATION
    ========================================== -->

    <div
        id="game-info"
        aria-label="Game information"
    >

        <div id="object-count">
            Objects: 0
        </div>

        <div id="zoom-display">
            Zoom: 100%
        </div>

        <div id="mode-display">
            MENU
        </div>

    </div>


    <!-- =========================================
         PAUSE MENU
    ========================================== -->

    <div
        id="pause-menu"
        aria-label="Pause menu"
    >

        <div class="menu-container">

            <div class="menu-title">
                PAUSED
            </div>

            <div class="menu-buttons">

                <button
                    id="resume-button"
                    class="menu-button"
                    type="button"
                >
                    RESUME
                </button>

                <button
                    id="pause-main-menu-button"
                    class="menu-button"
                    type="button"
                >
                    MAIN MENU
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================
         GAME JAVASCRIPT
    ========================================== -->

    <script
        type="module"
        src="./src/main.js"
    ></script>

</body>

</html>
