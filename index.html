<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Universe Smash</title>

    <meta
        name="description"
        content="Universe Smash - Cosmic Simulation Engine"
    >

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- ======================================================
         STARTUP SCREEN
         ====================================================== -->

    <div
        id="startup-screen"
        aria-label="Universe Smash startup screen"
    >

        <div id="startup-content">

            <div id="startup-logo">
                UNIVERSE SMASH
            </div>

            <div id="startup-warning">
                COSMIC SIMULATION ENGINE
            </div>

            <div id="startup-loading">
                INITIALIZING UNIVERSE...
            </div>

            <div id="loading-bar">
                <div id="loading-progress"></div>
            </div>

            <div id="loading-percent">
                0%
            </div>

            <div id="startup-status">
                LOADING
            </div>

            <div id="loading-status">
                Preparing simulation...
            </div>

            <div id="startup-title">
                PRESS START
            </div>

            <button
                id="start-button"
                type="button"
            >
                PRESS START
            </button>

            <button
                id="skip-startup"
                type="button"
            >
                SKIP
            </button>

        </div>

    </div>


    <!-- ======================================================
         MAIN MENU
         ====================================================== -->

    <div
        id="main-menu"
        aria-label="Main menu"
    >

        <div class="main-menu-inner">

            <div class="main-menu-title">
                UNIVERSE SMASH
            </div>

            <div class="main-menu-subtitle">
                COSMIC SIMULATION ENGINE
            </div>

            <div class="main-menu-buttons">

                <button
                    id="planet-mode-button"
                    class="menu-button"
                    type="button"
                >
                    PLANET MODE
                </button>

                <button
                    id="solar-system-button"
                    class="menu-button"
                    type="button"
                >
                    SOLAR SYSTEM MODE
                </button>

                <button
                    id="settings-button"
                    class="menu-button"
                    type="button"
                >
                    SETTINGS
                </button>

            </div>

        </div>

    </div>


    <!-- ======================================================
         GAME CANVAS
         ====================================================== -->

    <canvas
        id="game-canvas"
        aria-label="Universe Smash game canvas"
    ></canvas>


    <!-- ======================================================
         SOLAR SYSTEM MENU
         ====================================================== -->

    <div
        id="sandbox-menu"
        aria-label="Solar System controls"
        style="display:none;"
    >

        <div class="game-menu-panel">

            <div class="game-menu-title">
                SOLAR SYSTEM MODE
            </div>

            <button id="add-star" type="button">
                ⭐ STAR
            </button>

            <button id="add-blue-hypergiant" type="button">
                🔵 BLUE HYPERGIANT
            </button>

            <button id="add-contact-binary" type="button">
                ⭐⭐ CONTACT BINARY
            </button>

            <button id="add-planet" type="button">
                🌍 PLANET
            </button>

            <button id="add-moon" type="button">
                🌙 MOON
            </button>

            <button id="add-asteroid" type="button">
                ☄️ ASTEROID
            </button>

            <button id="add-antimatter-planet" type="button">
                🟣 ANTIMATTER PLANET
            </button>

            <button id="add-black-hole" type="button">
                🕳️ BLACK HOLE
            </button>

            <button id="add-grey-hole" type="button">
                🔴 GREY HOLE
            </button>

            <button id="add-wormhole" type="button">
                🌀 WORMHOLE
            </button>

            <button id="reset-solar-system" type="button">
                RESET SYSTEM
            </button>

            <button id="clear-solar-system" type="button">
                CLEAR SYSTEM
            </button>

            <button id="solar-main-menu" type="button">
                MAIN MENU
            </button>

        </div>

    </div>


    <!-- ======================================================
         PLANET WEAPON MENU
         ====================================================== -->

    <div
        id="planet-weapon-menu"
        aria-label="Planet Mode weapons"
        style="display:none;"
    >

        <div class="game-menu-panel">

            <div class="game-menu-title">
                PLANET MODE
            </div>

            <button
                id="weapon-laser"
                type="button"
            >
                🔴 LASER
            </button>

            <button
                id="weapon-ice-laser"
                type="button"
            >
                ❄️ ICE LASER
            </button>

            <button
                id="weapon-asteroid"
                type="button"
            >
                ☄️ ASTEROID
            </button>

            <button
                id="weapon-alien"
                type="button"
            >
                👽 ALIEN SHIP
            </button>

            <button
                id="weapon-antimatter"
                type="button"
            >
                🟣 ANTIMATTER
            </button>

            <button
                id="weapon-mystery"
                type="button"
            >
                ❓ MYSTERY MATTER
            </button>

            <button
                id="planet-main-menu"
                type="button"
            >
                MAIN MENU
            </button>

        </div>

    </div>


    <!-- ======================================================
         GAME INFORMATION
         ====================================================== -->

    <div
        id="game-info"
        aria-label="Game information"
        style="display:none;"
    >

        <div id="game-mode-label">
            UNIVERSE SMASH
        </div>

        <button
            id="game-pause-button"
            type="button"
        >
            PAUSE
        </button>

        <button
            id="game-menu-button"
            type="button"
        >
            MENU
        </button>

    </div>


    <!-- ======================================================
         SETTINGS
         ====================================================== -->

    <div
        id="settings-menu"
        aria-label="Settings"
        style="display:none;"
    >

        <div class="game-menu-panel">

            <div class="game-menu-title">
                SETTINGS
            </div>

            <button
                id="settings-back-button"
                type="button"
            >
                BACK
            </button>

        </div>

    </div>


    <!-- ======================================================
         GAME SCRIPT
         ====================================================== -->

    <script
        type="module"
        src="./src/main.js"
    ></script>

</body>
</html>
