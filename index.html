<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Universe Smash - A cosmic physics sandbox"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>Universe Smash</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- =====================================================
         STARTUP SCREEN
    ====================================================== -->

    <div
        id="startup-screen"
        aria-label="Universe Smash startup screen"
    >

        <div class="startup-container">

            <div class="startup-title">
                UNIVERSE SMASH
            </div>

            <div class="startup-subtitle">
                COSMIC SIMULATION ENGINE
            </div>

            <div class="loading-container">

                <div class="loading-bar">

                    <div
                        class="loading-progress"
                        id="loading-progress"
                    ></div>

                </div>

            </div>

            <div
                class="press-start"
                id="press-start"
                style="display: none;"
            >
                PRESS START
            </div>

        </div>

    </div>


    <!-- =====================================================
         MAIN MENU
    ====================================================== -->

    <div
        id="main-menu"
        style="display: none;"
    >

        <div class="menu-container">

            <div class="menu-title">
                UNIVERSE SMASH
            </div>

            <div class="menu-buttons">

                <button
                    id="planet-mode-button"
                    class="menu-button"
                    type="button"
                >
                    PLANET MODE
                </button>

                <button
                    id="solar-mode-button"
                    class="menu-button"
                    type="button"
                >
                    SOLAR SYSTEM MODE
                </button>

                <button
                    id="settings-button"
                    class="menu-button"
                    type="button"
                >
                    SETTINGS
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         GAME
    ====================================================== -->

    <main
        id="game-container"
        style="display: none;"
    >

        <canvas
            id="game-canvas"
            width="1280"
            height="720"
            aria-label="Universe Smash game canvas"
        ></canvas>


        <!-- =================================================
             SOLAR SYSTEM MODE MENU
        ================================================== -->

        <div
            id="sandbox-menu"
            style="display: none;"
        >

            <div class="menu-section-title">
                SOLAR SYSTEM
            </div>

            <button
                id="spawn-star"
                class="game-button"
                type="button"
            >
                ⭐ STAR
            </button>

            <button
                id="spawn-planet"
                class="game-button"
                type="button"
            >
                🌎 PLANET
            </button>

            <button
                id="spawn-moon"
                class="game-button"
                type="button"
            >
                🌙 MOON
            </button>

            <button
                id="spawn-asteroid"
                class="game-button"
                type="button"
            >
                ☄️ ASTEROID
            </button>

            <button
                id="spawn-antimatter"
                class="game-button"
                type="button"
            >
                💜 ANTIMATTER WORLD
            </button>

            <button
                id="spawn-black-hole"
                class="game-button"
                type="button"
            >
                🕳️ BLACK HOLE
            </button>

            <button
                id="spawn-grey-hole"
                class="game-button"
                type="button"
            >
                🔴 GREY HOLE
            </button>

            <button
                id="spawn-wormhole"
                class="game-button"
                type="button"
            >
                🌀 WORMHOLE
            </button>

            <button
                id="reset-camera"
                class="game-button"
                type="button"
            >
                🎯 RESET CAMERA
            </button>

            <button
                id="clear-system"
                class="game-button"
                type="button"
            >
                🗑️ CLEAR SYSTEM
            </button>

            <button
                id="solar-menu"
                class="game-button"
                type="button"
            >
                ← MAIN MENU
            </button>

        </div>


        <!-- =================================================
             PLANET MODE WEAPONS
        ================================================== -->

        <div
            id="planet-weapon-menu"
            style="display: none;"
        >

            <div class="menu-section-title">
                PLANET MODE
            </div>

            <button
                id="weapon-laser"
                class="game-button"
                type="button"
            >
                🔴 LASER
            </button>

            <button
                id="weapon-ice-laser"
                class="game-button"
                type="button"
            >
                ❄️ ICE LASER
            </button>

            <button
                id="weapon-asteroid"
                class="game-button"
                type="button"
            >
                ☄️ ASTEROID
            </button>

            <button
                id="weapon-mystery"
                class="game-button"
                type="button"
            >
                ❓ MYSTERY MATTER
            </button>

            <button
                id="weapon-alien"
                class="game-button"
                type="button"
            >
                👽 ALIEN SHIP
            </button>

            <button
                id="weapon-antimatter"
                class="game-button"
                type="button"
            >
                💥 ANTIMATTER
            </button>

            <button
                id="planet-menu"
                class="game-button"
                type="button"
            >
                ← MAIN MENU
            </button>

        </div>


        <!-- =================================================
             SETTINGS
        ================================================== -->

        <div
            id="settings-panel"
            style="display: none;"
        >

            <div class="settings-panel">

                <div class="settings-title">
                    SETTINGS
                </div>

                <button
                    id="settings-close"
                    class="game-button"
                    type="button"
                >
                    CLOSE
                </button>

            </div>

        </div>


        <!-- =================================================
             GAME INFORMATION
        ================================================== -->

        <div
            id="game-info"
            style="display: none;"
        >

            <div id="object-count">
                Objects: 0
            </div>

            <div id="zoom-display">
                Zoom: 100%
            </div>

        </div>


        <!-- =================================================
             CROSSHAIR
        ================================================== -->

        <div
            id="crosshair"
            style="display: none;"
        ></div>


        <!-- =================================================
             PAUSE MENU
        ================================================== -->

        <div
            id="pause-menu"
            style="display: none;"
        >

            <div class="menu-container">

                <div class="menu-title">
                    PAUSED
                </div>

                <div class="menu-buttons">

                    <button
                        id="resume-button"
                        class="menu-button"
                        type="button"
                    >
                        RESUME
                    </button>

                    <button
                        id="pause-menu-button"
                        class="menu-button"
                        type="button"
                    >
                        MAIN MENU
                    </button>

                </div>

            </div>

        </div>

    </main>


    <!-- =====================================================
         GAME ENGINE
    ====================================================== -->

    <script
        type="module"
        src="./src/main.js"
    ></script>

</body>

</html>
